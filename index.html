<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediaMart – Đề xuất Tăng Tồn / Giảm Tồn</title>
<style>
:root{--red:#ff0000;--red2:#e30613;--dark:#c8000b;--yel:#ffd400;--blue:#185FA5;--bar:46px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',Roboto,Arial,sans-serif;background:#f2f2f2;color:#222;overflow:hidden}
svg.defs{position:absolute;width:0;height:0}

/* ============ LANDING ============ */
#landing{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#ff3b30 0,#e5101a 48%,#a3000a 100%);transition:opacity .5s,visibility .5s}
#landing.hide{opacity:0;visibility:hidden;pointer-events:none}
.rays{position:absolute;left:50%;top:44%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,255,255,.06) 0 9deg,transparent 9deg 18deg);animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.shine{position:absolute;top:0;bottom:0;width:120px;left:-160px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-18deg);animation:shine 7s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%{left:-160px}60%,100%{left:112%}}
.bunting{position:absolute;left:0;top:0;width:100%;height:74px;pointer-events:none;z-index:2}
.bunting g{transform-origin:0 0;animation:sway 3.6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-.25deg)}to{transform:rotate(.25deg)}}
.logo{position:absolute;z-index:4;left:clamp(14px,2.6vw,34px);top:clamp(46px,7vh,70px);font:italic 800 clamp(26px,3vw,38px)/1 'Segoe UI',Arial,sans-serif;letter-spacing:-.5px;color:#fff;text-shadow:0 2px 0 rgba(120,0,8,.45)}
.logo i{font-weight:600}

.center{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 16px 24px;gap:clamp(14px,3vh,26px)}
.b-title{font-style:italic;font-weight:900;line-height:1}
.b-title .l1{display:block;font-size:clamp(30px,4.4vw,56px);color:#fff;text-shadow:0 3px 0 #a3000a,0 8px 14px rgba(0,0,0,.2)}
.b-title .l2{display:block;margin-top:4px;font-size:clamp(36px,5.6vw,72px);color:var(--yel);-webkit-text-stroke:2px #b3000c;paint-order:stroke fill;text-shadow:0 4px 0 #b3000c,0 9px 16px rgba(0,0,0,.25)}
.sub{display:inline-block;background:#fff;color:#c4000d;font-weight:700;font-size:14px;padding:5px 18px;border-radius:16px;letter-spacing:.02em}
.btns{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;width:min(720px,100%)}
.pick{flex:1 1 270px;max-width:340px;border:0;border-radius:4px;cursor:pointer;text-align:left;padding:16px 20px;display:flex;align-items:center;gap:14px;
  font-family:inherit;box-shadow:0 6px 0 rgba(0,0,0,.25),0 12px 22px rgba(0,0,0,.28);transition:transform .15s,box-shadow .15s;position:relative}
.pick:hover,.pick:focus-visible{transform:translateY(-3px);box-shadow:0 9px 0 rgba(0,0,0,.25),0 16px 26px rgba(0,0,0,.32);outline:3px solid #fff;outline-offset:2px}
.pick:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.pick .ar{font-size:26px;line-height:1;width:46px;height:46px;border-radius:4px;display:grid;place-items:center;flex:none}
.pick b{display:block;font-size:23px;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.pick small{display:block;font-size:12.5px;margin-top:3px;opacity:.85}
.pick.t{background:var(--yel);color:#b3000c}.pick.t .ar{background:#b3000c;color:var(--yel);animation:nudgeU 1.6s ease-in-out infinite}
.pick.g{background:#fff;color:var(--blue)}.pick.g .ar{background:var(--blue);color:#fff;animation:nudgeD 1.6s ease-in-out infinite}
@keyframes nudgeU{50%{transform:translateY(-4px)}}@keyframes nudgeD{50%{transform:translateY(4px)}}
.note{color:rgba(255,255,255,.85);font-size:13px;letter-spacing:.03em}

/* banner quảng cáo chạy */
.ads{position:relative;width:min(660px,100%);aspect-ratio:16/5;border-radius:6px;overflow:hidden;background:#7a000a;border:2px solid rgba(255,255,255,.9);
  box-shadow:0 8px 0 rgba(0,0,0,.2),0 14px 26px rgba(0,0,0,.35);touch-action:pan-y;user-select:none}
.ads.loading::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);background-size:200% 100%;animation:skel 1.2s linear infinite}
@keyframes skel{from{background-position:200% 0}to{background-position:-200% 0}}
.ads .sl{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .8s,visibility .8s}
.ads .sl.on{opacity:1;visibility:visible}
.ads .sl .bg{position:absolute;left:-8%;top:-8%;width:116%;height:116%;object-fit:cover;filter:blur(16px) brightness(.85)}
.ads .sl .fg{position:relative;display:block;width:100%;height:100%;object-fit:contain;transform:scale(1);transition:transform 6s linear}
.ads .sl.on .fg{transform:scale(1.035)}
.ads .nv{position:absolute;top:50%;width:34px;height:34px;margin-top:-17px;border:0;border-radius:50%;background:rgba(255,255,255,.88);color:#c4000d;font:700 18px/1 inherit;cursor:pointer;z-index:3;opacity:0;transition:opacity .2s,transform .15s;display:grid;place-items:center}
.ads:hover .nv,.ads .nv:focus-visible{opacity:1}.ads .nv:hover{transform:scale(1.1)}
.ads .nv.p{left:8px}.ads .nv.n{right:8px}
.ads .dots{position:absolute;left:0;right:0;bottom:9px;display:flex;justify-content:center;gap:7px;z-index:3}
.ads .dots button{width:9px;height:9px;padding:0;border:0;border-radius:5px;background:rgba(255,255,255,.65);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:width .3s,background .3s}
.ads .dots button.on{width:24px;background:var(--yel)}
.ads .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--yel);z-index:3;width:0}
.ads .bar.run{animation:prog var(--t,4500ms) linear forwards}
@keyframes prog{to{width:100%}}
@media(hover:none){.ads .nv{opacity:.85}}

/* icon sản phẩm trang trí nền */
.ic{position:absolute;z-index:1;width:var(--s,clamp(72px,15vmin,160px));aspect-ratio:1;left:var(--x);top:var(--y);pointer-events:none;
  animation:bobi 5.5s ease-in-out infinite;animation-delay:var(--d,0s)}
.ic.r{left:auto;right:var(--x)}
.ic::before{content:"";position:absolute;inset:-22%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.34),rgba(255,255,255,0) 68%)}
.ic svg{position:relative;width:100%;height:100%;filter:drop-shadow(0 12px 12px rgba(80,0,5,.45))}
@keyframes bobi{0%,100%{transform:translateY(0) rotate(var(--rot,-4deg))}50%{transform:translateY(-16px) rotate(calc(var(--rot,-4deg)*-1))}}
.glow{animation:glowp 2s ease-in-out infinite}
@keyframes glowp{50%{opacity:.45}}
.air{stroke-dasharray:4 5;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-18}}

/* ink→red wipe */
#wipe{position:fixed;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;z-index:50;pointer-events:none;transform:scale(0);will-change:transform}
#wipe.t{background:radial-gradient(circle,#ff3b30 0,#e30613 55%,#a3000a 100%)}
#wipe.g{background:radial-gradient(circle,#3b8fe0 0,#185FA5 55%,#0a2f57 100%)}
#wipe.go{transform:scale(var(--k));transition:transform .75s cubic-bezier(.65,0,.35,1)}
#wipe.out{transform:scale(0);transition:transform .6s cubic-bezier(.65,0,.35,1)}

/* ============ APP ============ */
#app{position:fixed;inset:0;display:none;flex-direction:column;background:#fff;opacity:0;transition:opacity .45s}
#app.show{display:flex}#app.vis{opacity:1}
#bar{height:var(--bar);flex:0 0 var(--bar);display:flex;align-items:center;gap:10px;padding:0 12px;color:#fff;transition:background .4s;background:#222}
#app.mode-t #bar{background:linear-gradient(90deg,#c4000d,#ff1a1a)}
#app.mode-g #bar{background:linear-gradient(90deg,#0a2f57,#185FA5)}
.home{display:flex;align-items:center;gap:8px;border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:20px;padding:5px 14px 5px 8px;cursor:pointer;font:600 13px inherit;font-family:inherit;transition:background .2s}
.home:hover{background:rgba(255,255,255,.32)}
.home svg{width:20px;height:20px;fill:#fff}
.seg{margin-left:auto;display:flex;background:rgba(0,0,0,.3);border-radius:22px;padding:3px;position:relative}
.seg button{position:relative;z-index:1;border:0;background:none;color:rgba(255,255,255,.8);font:600 13px inherit;font-family:inherit;padding:7px 18px;border-radius:18px;cursor:pointer;transition:color .3s}
.seg button.on{color:#111}
.seg .pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:#fff;border-radius:18px;transition:transform .4s cubic-bezier(.3,1.3,.5,1)}
.seg.g .pill{transform:translateX(100%)}
.title{font-weight:700;font-size:14px;white-space:nowrap}
.frames{position:relative;flex:1;min-height:0}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;opacity:0;visibility:hidden;transform:scale(.985);transition:opacity .4s,transform .4s,visibility .4s}
.frames iframe.on{opacity:1;visibility:visible;transform:none}

@media(max-width:900px){.ic{--s:clamp(56px,16vw,92px);opacity:.6;left:var(--mx);top:var(--my);right:auto}.ic.r{left:var(--mx);right:auto}.title{display:none}.seg button{padding:7px 12px}.home span{display:none}.home{padding:5px 8px}}
@media(max-width:900px){.ads{aspect-ratio:2.4/1}.note{display:none}.center{gap:12px}.pick{padding:12px 16px}.pick small{display:none}}
@media(max-height:700px){.note{display:none}}
@media(max-height:600px){.sub{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
const dec=id=>new TextDecoder('utf-8').decode(Uint8Array.from(atob($(id).textContent.trim()),c=>c.charCodeAt(0)));
const FR={t:$('fT'),g:$('fG')},TT={t:'Đề xuất Tăng Tồn',g:'Phiếu Đề xuất Giảm Tồn'};
const loaded={};let mode=null,busy=false;
function ensure(m){ if(loaded[m])return; FR[m].srcdoc=dec(m==='t'?'srcT':'srcG'); loaded[m]=true; }
function setMode(m){
  mode=m; ensure(m);
  $('app').classList.remove('mode-t','mode-g');$('app').classList.add('mode-'+m);
  FR.t.classList.toggle('on',m==='t');FR.g.classList.toggle('on',m==='g');
  $('seg').classList.toggle('g',m==='g');$('sT').classList.toggle('on',m==='t');$('sG').classList.toggle('on',m==='g');
  $('ttl').textContent=TT[m];
  document.title=(m==='t'?'Tăng Tồn':'Giảm Tồn')+' – MediaMart';
}
function wipe(cls,from){
  const w=$('wipe'),r=from.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2,k=Math.hypot(Math.max(cx,innerWidth-cx),Math.max(cy,innerHeight-cy))/5*1.05;
  w.className=cls;w.style.left=cx+'px';w.style.top=cy+'px';w.style.setProperty('--k',k);
  void w.offsetWidth;return w;
}
function choose(m){
  if(busy)return;busy=true;
  const w=wipe(m,m==='t'?$('bT'):$('bG'));w.classList.add('go');ensure(m);
  setTimeout(()=>{
    $('landing').classList.add('hide');setMode(m);
    $('app').classList.add('show');requestAnimationFrame(()=>$('app').classList.add('vis'));
    w.className='';w.style.transform='scale(0)';busy=false;
  },800);
}
function home(){
  if(busy)return;busy=true;
  const w=wipe(mode,$('home'));w.classList.add('go');
  setTimeout(()=>{
    $('app').classList.remove('vis','show');$('landing').classList.remove('hide');
    w.classList.remove('go');w.classList.add('out');
    setTimeout(()=>{w.className='';w.style.transform='scale(0)';busy=false},650);
  },800);
}
function switchTo(m){
  if(busy||m===mode)return;busy=true;
  const w=wipe(m,m==='t'?$('sT'):$('sG'));w.classList.add('go');
  setTimeout(()=>{setMode(m);w.classList.remove('go');w.classList.add('out');
    setTimeout(()=>{w.className='';w.style.transform='scale(0)';busy=false},600)},800);
}
$('bT').onclick=()=>choose('t');$('bG').onclick=()=>choose('g');

/* ===== Banner quảng cáo chạy ===== */
(function(){
  const URLS=['https://cdn.mediamart.vn/images/banner/ctkm-t10_422f6e3e.png','https://cdn.mediamart.vn/images/banner/av-29_2a72b9c8.jpg','https://cdn.mediamart.vn/images/banner/tl-t7_9cb47651.jpg','https://cdn.mediamart.vn/images/banner/bep-sale_5326be87.png','https://cdn.mediamart.vn/images/banner/coex-sale_41d96c4f.png'];
  const INTERVAL=4500,box=$('ads'),dotsEl=$('adD'),bar=$('adB');
  box.style.setProperty('--t',INTERVAL+'ms');
  let slides=[],dots=[],idx=0,timer=null,hover=false;
  const load=u=>new Promise(res=>{const im=new Image();im.referrerPolicy='no-referrer';const to=setTimeout(()=>res(false),9000);
    im.onload=()=>{clearTimeout(to);res(true)};im.onerror=()=>{clearTimeout(to);res(false)};im.src=u});
  function go(i){
    if(!slides.length)return;
    idx=(i+slides.length)%slides.length;
    slides.forEach((s,k)=>s.classList.toggle('on',k===idx));
    dots.forEach((d,k)=>d.classList.toggle('on',k===idx));
    bar.classList.remove('run');void bar.offsetWidth;bar.classList.add('run');
    clearTimeout(timer);timer=setTimeout(tick,INTERVAL);
  }
  function tick(){
    if(hover||document.hidden||$('landing').classList.contains('hide')){timer=setTimeout(tick,800);bar.classList.remove('run');return}
    go(idx+1);
  }
  Promise.all(URLS.map(load)).then(ok=>{
    const good=URLS.filter((u,k)=>ok[k]);
    box.classList.remove('loading');
    if(!good.length){box.style.display='none';return}   // mạng chặn CDN → ẩn banner, không ảnh hưởng chức năng
    good.forEach((u,k)=>{
      const s=document.createElement('div');s.className='sl';
      s.innerHTML='<img class="bg" alt="" referrerpolicy="no-referrer" src="'+u+'"><img class="fg" alt="Quảng cáo MediaMart '+(k+1)+'" referrerpolicy="no-referrer" src="'+u+'" draggable="false">';
      box.insertBefore(s,box.querySelector('.nv'));slides.push(s);
      const d=document.createElement('button');d.setAttribute('aria-label','Quảng cáo '+(k+1));d.onclick=()=>go(k);dotsEl.appendChild(d);dots.push(d);
    });
    if(good.length<2){$('adP').style.display=$('adN').style.display='none';dotsEl.style.display='none'}
    go(0);
  });
  $('adP').onclick=()=>go(idx-1);$('adN').onclick=()=>go(idx+1);
  box.addEventListener('mouseenter',()=>{hover=true;bar.classList.remove('run')});
  box.addEventListener('mouseleave',()=>{hover=false;go(idx)});
  let x0=null;
  box.addEventListener('pointerdown',e=>{x0=e.clientX});
  box.addEventListener('pointerup',e=>{if(x0===null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)>40)go(idx+(dx<0?1:-1))});
  document.addEventListener('keydown',e=>{if($('landing').classList.contains('hide'))return;if(e.key==='ArrowLeft')go(idx-1);if(e.key==='ArrowRight')go(idx+1)});
})();
$('home').onclick=home;$('sT').onclick=()=>switchTo('t');$('sG').onclick=()=>switchTo('g');
</script>
</body>
</html>
